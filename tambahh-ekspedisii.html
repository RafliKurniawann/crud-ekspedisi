<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah Ekspedisi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container kecil">
    <div class="header">
        <div>
            <h1>Tambah Kurir</h1>
            <p>Masukkan data ekspedisi.</p>
        </div>
        <a href="index.html" class="btn">← Kembali</a>
    </div>

    <div class="card">
        <form action="tambahh-ekspedisii.php" method="POST">
            <label>Kode Kurir</label>
            <input type="text" name="kode" placeholder="Contoh: JNT">

            <label>Nama Ekspedisi</label>
            <input type="text" name="nama_ekspedisi" placeholder="Contoh: J&T Express">

            <label>Nomor Telepon</label>
            <input type="text" name="nomor_telepon" placeholder="08123456789">

            <label>Jenis Layanan</label>
            <select name="layanan">
                <option>Reguler</option>
                <option>Express</option>
                <option>Kargo</option>
            </select>

            <label>Zonasi</label>
            <input type="text" name="zonasi" placeholder="Contoh: Nasional">

            <button type="submit">Simpan Data</button>  
        </form>
    </div>
</div>

</body>
</html>
